name: Release macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      package-version: ${{ steps.release.outputs.package-version }}
      release-sha: ${{ steps.release.outputs.release-sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Verify release ref and version
        id: release
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "Tag $RELEASE_TAG does not match package version v${package_version}." >&2
            exit 1
          fi
          notes_file="docs/releases/${package_version}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Missing release notes: $notes_file" >&2
            exit 1
          fi
          git fetch origin main
          release_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$release_sha" = "$GITHUB_SHA"
            test "$release_sha" = "$(git rev-parse origin/main)"
          else
            git merge-base --is-ancestor "$release_sha" origin/main
            git diff --exit-code "$release_sha" "$GITHUB_SHA" -- . \
              ':(exclude).github/workflows' ':(exclude)tests' \
              ':(exclude)scripts/audit-linux-package.mjs' \
              ':(exclude)scripts/audit-macos-package.mjs' \
              ':(exclude)scripts/audit-windows-package.mjs'
          fi
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run release gate
        run: npm run check -- --portable-linux

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            app-path: release/mac-arm64/Flapstack.app
            platform: darwin-arm64
          - arch: x64
            runner: macos-15-intel
            app-path: release/mac/Flapstack.app
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.release-sha }}

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build

      - name: Build unsigned DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/package-app.mjs \
            --platform=darwin \
            --arch=${{ matrix.arch }} \
            --channel=release

      - name: Inspect and smoke-test native package
        run: |
          node scripts/inspect-packaged-binaries.mjs \
            --app='${{ matrix.app-path }}' \
            --platform=${{ matrix.platform }} \
            --smoke

      - name: Audit macOS package security
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          git worktree add --detach "$RUNNER_TEMP/release-auditor" "$GITHUB_SHA"
          export NODE_PATH="$GITHUB_WORKSPACE/node_modules"
          node "$RUNNER_TEMP/release-auditor/scripts/audit-macos-package.mjs" \
            --source-root="$GITHUB_WORKSPACE" \
            --app='${{ matrix.app-path }}' \
            --platform=${{ matrix.platform }} \
            --channel=release \
            --artifact='release/Flapstack-${{ needs.verify.outputs.package-version }}-${{ matrix.arch }}.dmg' \
            --output='release/macos-security-${{ matrix.arch }}.json'

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flapstack-${{ matrix.arch }}
          path: |
            release/Flapstack-${{ needs.verify.outputs.package-version }}-${{ matrix.arch }}.dmg
            release/macos-security-${{ matrix.arch }}.json
            release/macos-security-${{ matrix.arch }}.json.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.release-sha }}

      - name: Download DMGs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: flapstack-*
          path: release
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          dmg_count="$(find release -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [[ "$dmg_count" != "2" ]]; then
            echo "Expected two DMGs, found $dmg_count." >&2
            exit 1
          fi
          cd release
          sha256sum ./*.dmg > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.package-version }}
        run: |
          gh release create "v$PACKAGE_VERSION" \
            release/*.dmg \
            release/SHA256SUMS.txt \
            --verify-tag \
            --prerelease \
            --title "Flapstack $PACKAGE_VERSION" \
            --notes-file "docs/releases/${PACKAGE_VERSION}.md"
