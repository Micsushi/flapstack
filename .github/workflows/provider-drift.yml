name: Provider Drift

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/provider-drift.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-codex-model-catalog.mjs"
      - "src/shared/model-catalog.ts"
      - "tests/github-actions-runner-security.test.ts"
      - "tests/model-catalog.test.ts"

permissions:
  contents: read

jobs:
  scheduled-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, flapstack]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check
        run: npm run check

  codex-catalog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, flapstack]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Static model catalog tests
        run: node scripts/run-project-bin.mjs vitest vitest -- run tests/model-catalog.test.ts tests/github-actions-runner-security.test.ts

      - name: Read bundled Codex model catalog
        run: npx codex debug models --bundled > codex-models-bundled.json

      - name: Read live Codex model catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$CODEX_API_KEY" ]; then
            echo "No OPENAI_API_KEY or CODEX_API_KEY secret configured; skipping live provider catalog check." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx codex debug models > codex-models-live.json

      - name: Check live Codex catalog drift
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles('codex-models-live.json') != ''
        env:
          CODEX_MODELS_CATALOG_JSON: codex-models-live.json
          REQUIRE_CODEX_MODELS_CATALOG: "1"
        run: npm run test:codex-model-catalog

      - name: Upload Codex catalogs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-model-catalogs
          path: |
            codex-models-bundled.json
            codex-models-live.json
          if-no-files-found: ignore

  codex-catalog-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Static model catalog and runner policy tests
        run: node scripts/run-project-bin.mjs vitest vitest -- run tests/model-catalog.test.ts tests/github-actions-runner-security.test.ts

      - name: Read bundled Codex model catalog
        run: npx codex debug models --bundled > codex-models-bundled.json

      - name: Upload bundled Codex catalog
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-model-catalog-pr
          path: codex-models-bundled.json
          if-no-files-found: ignore
