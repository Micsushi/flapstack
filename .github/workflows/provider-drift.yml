name: Provider Drift

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codex-catalog:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, flapstack]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Static model catalog tests
        run: npm run test:model-catalog

      - name: Read bundled Codex model catalog
        run: npx codex debug models --bundled > codex-models-bundled.json

      - name: Read live Codex model catalog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$CODEX_API_KEY" ]; then
            echo "No OPENAI_API_KEY or CODEX_API_KEY secret configured; skipping live provider catalog check." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx codex debug models > codex-models-live.json

      - name: Check live Codex catalog drift
        if: hashFiles('codex-models-live.json') != ''
        env:
          CODEX_MODELS_CATALOG_JSON: codex-models-live.json
          REQUIRE_CODEX_MODELS_CATALOG: "1"
        run: npm run test:codex-model-catalog

      - name: Upload Codex catalogs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-model-catalogs
          retention-days: 1
          path: |
            codex-models-bundled.json
            codex-models-live.json
          if-no-files-found: ignore
