name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, flapstack]
    timeout-minutes: 60
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check
        run: npm run check -- --portable-linux

      - name: Build Linux Preview artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run package:preview:linux:artifacts

      - name: Inspect Linux Preview
        run: npm run package:inspect:preview:linux

      - name: Smoke Linux Preview
        run: npm run package:smoke:preview:linux

      - name: Audit Linux Preview
        run: npm run package:audit:preview:linux

      - name: Rehash Linux Preview audit
        shell: bash
        run: |
          report="release-preview/linux-security-report-x64.json"
          expected="$(awk '{print $1}' "$report.sha256")"
          actual="$(sha256sum "$report" | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Upload Linux Preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flapstack-preview-linux-${{ github.sha }}
          path: |
            release-preview/linux-unpacked
            release-preview/*.AppImage
            release-preview/*.deb
            release-preview/linux-security-report-x64.json
            release-preview/linux-security-report-x64.json.sha256
          if-no-files-found: error
          retention-days: 3

  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check
        run: npm run check

  windows-verify:
    runs-on: windows-2022
    env:
      FLAPSTACK_REQUIRE_FILE_SYMLINK_TESTS: "1"
    timeout-minutes: 60
    concurrency:
      group: windows-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Windows prerequisites
        run: npm run windows:prerequisites

      - name: Configure Stage 6 performance profile
        shell: pwsh
        run: |
          powercfg /SETACTIVE SCHEME_BALANCED
          powercfg /GETACTIVESCHEME

      - name: Check
        run: npm run check

      - name: Build Windows Preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run package:preview:win

      - name: Inspect Windows Preview
        run: npm run package:inspect:preview:win

      - name: Audit Windows Preview
        run: npm run package:audit:preview:win

      - name: Rehash Windows Preview audit
        shell: pwsh
        run: |
          $report = "release-preview/windows-security-report.json"
          $expected = ((Get-Content "$report.sha256" -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Windows Preview security report changed after audit."
          }

      - name: Upload Windows Preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flapstack-preview-windows-${{ github.sha }}
          path: |
            release-preview/win-unpacked
            release-preview/windows-security-report.json
            release-preview/windows-security-report.json.sha256
          if-no-files-found: error
          retention-days: 3

  macos-verify:
    if: vars.FLAPSTACK_MACOS_CI_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: macos-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Build macOS Preview
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run package:preview:mac

      - name: Inspect macOS Preview
        run: npm run package:smoke:preview:mac
